<script>
(async()=>{const el=document.getElementById('stats');try{
const r=await fetch('stats/latest.json',{cache:'no-store'});if(!r.ok)throw new Error();
const s=await r.json();const v=s.traffic||{},g=s.repository||{};
el.innerHTML='<strong>Son güncelleme:</strong> '+(s.collected_at||'—')+
'<br>Yıldız: '+(g.stargazers_count??'—')+
'<br>Fork: '+(g.forks_count??'—')+
'<br>Son 14 günlük görüntüleme: '+(v.views_14d??'—')+
'<br>Son 14 günlük klonlama: '+(v.clones_14d??'—');
}catch(e){el.textContent='İstatistik dosyası henüz oluşturulmadı.'}})();
</script>
