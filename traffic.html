<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Science & Philosophy — Makaleler</title>
<meta name="description" content="Science & Philosophy makalelerine erişim.">
</head>
<body>
<main>
<h1>Science & Philosophy</h1>
<p>Bilim, felsefe, kozmoloji ve teknoloji yazıları.</p>
<p><a href="https://emrepelit7337.blogspot.com" rel="noopener">Blogger'daki tüm makalelere git</a></p>
<p><a href="https://science-philosophy.grok.me" rel="noopener">Science & Philosophy sitesini aç</a></p>
<p id="stats">GitHub verisi yükleniyor…</p>
</main>
<script>
fetch('stats/traffic-bridge.json',{cache:'no-store'})
.then(r=>r.json())
.then(s=>{
  const g=s.github||{};
  document.getElementById('stats').textContent =
    'GitHub son 14 gün: '+(g.views_14d??0)+' görüntüleme · '+
    (g.unique_views_14d??0)+' benzersiz ziyaret.';
})
.catch(()=>{});
</script>
</body>
</html>
