name: Sync GitHub-to-Blogger traffic bridge

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build traffic bridge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/build_traffic_bridge.py

      - name: Commit bridge statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/traffic-bridge.json
          if git diff --cached --quiet; then
            echo "No bridge changes."
          else
            git commit -m "chore: sync GitHub-to-Blogger traffic bridge"
            git push
          fi
