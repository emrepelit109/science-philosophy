name: Update interaction statistics

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: science-philosophy-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect and synchronize statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/update_stats.py

      - name: Commit synchronized statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/latest.json stats/history.csv stats/history-summary.json stats/traffic-bridge.json
          if git diff --cached --quiet; then
            echo "No statistics changes."
          else
            git commit -m "chore: sync interaction statistics"
            git push
          fi
